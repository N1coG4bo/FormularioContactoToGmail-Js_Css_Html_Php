<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctame</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h2>Envíame un mensaje</h2>
        
        <form action="enviar.php" method="POST" id="miFormulario">
            
            <div class="grupo-input">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="grupo-input">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="grupo-input">
                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje" required>
            </div>

            <div class="grupo-input">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe aquí..." required></textarea>
            </div>

            <button type="submit">Enviar Correo</button>
        </form>
    </div>

    <script src="validacion.js"></script>

</body>
</html>
